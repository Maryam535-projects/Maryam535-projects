# Generates the animated contribution snake used at the bottom of the README.
# Path in your repo must be exactly: .github/workflows/snake.yml
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # refresh twice a day
  workflow_dispatch:          # lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: Maryam535-projects
          outputs: |
            dist/snake.svg?color_snake=#6C63FF&color_dots=#161B22,#2d2a5e,#4a41a8,#6C63FF,#9d97ff
            dist/snake-dark.svg?palette=github-dark&color_snake=#6C63FF

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
